; Phone photos are 3–8 MB; they are shrunk automatically after upload
upload_max_filesize = 10M
post_max_size = 32M
memory_limit = 256M
expose_php = Off

; Faster PHP: keep compiled code in memory
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
