# Apache site for the Gardener app.
# The listening port is set from $PORT by docker/entrypoint.sh.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # public/.htaccess holds the rewrites, gzip and caching rules
        AllowOverride All
        Require all granted
    </Directory>

    # Uploaded images live on the mounted disk and are reached through a symlink
    <Directory /var/www/html/public/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Logs go to the container output, where the host shows them
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
