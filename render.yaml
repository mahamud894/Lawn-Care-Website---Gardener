# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New → Blueprint → pick this repository. Everything below is
# created for you; the values marked "sync: false" are asked for once.
#
# Note: the "starter" plan is needed because free web services cannot have a
# disk, and without a disk every uploaded photo and the database are erased
# whenever the service restarts. To try it for free anyway, set plan: free
# and delete the whole "disk:" block below.

services:
  - type: web
    name: gardener
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    branch: main
    healthCheckPath: /up
    autoDeploy: true

    disk:
      name: gardener-data
      mountPath: /data
      sizeGB: 5

    envVars:
      # --- application ---
      - key: APP_NAME
        value: Gardener
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: APP_KEY
        # php artisan key:generate --show  (leave empty to have one generated
        # on first boot and stored on the disk)
        sync: false
      - key: APP_URL
        # https://gardener.onrender.com or your own domain
        sync: false
      - key: LOG_CHANNEL
        value: stderr

      # --- database: SQLite on the mounted disk ---
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /data/database.sqlite

      # --- sessions, cache, queue ---
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync

      # --- the main admin account, created on first boot ---
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

      # --- e-mail (booking and contact alerts) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

      # --- business settings ---
      - key: CURRENCY
        value: BDT
      - key: CURRENCY_SYMBOL
        value: "৳"
      - key: WHATSAPP_NUMBER
        value: "8801846650807"

      # --- optional services (see README) ---
      - key: SMS_DRIVER
        value: log
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
